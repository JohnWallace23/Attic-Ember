<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Attic & Ember profile picture — Instagram, PayPal, Venmo, anywhere a
       square avatar is wanted.

       This is the homepage scene itself: the same crescent, the same five-lobe
       pumpkin and curled stem, lifted from the hero SVG in index.html, and
       the cat itself straight out of cat.js — its "pose-sit" markup, seated
       where CSS seats it on the moon. A favicon can't carry this much (see favicon.svg), but an
       avatar is shown big enough to hold all three.

       The ground is a plain square, not a rounded one — every one of these
       services crops to a circle, so rounded corners would be cut away
       regardless. The scene is scaled to sit inside that circle with room to
       spare, so nothing important meets the edge. -->
  <defs>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9A84E" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#D9A84E" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#D9A84E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#201C18"/>

  <!-- hero coords are 400x340; this centres that scene in the square -->
  <g transform="translate(512 512) scale(2.3040) translate(-216.2 -155.5)">

    <circle cx="270" cy="140" r="132" fill="url(#moon-glow)"/>

    <!-- crescent moon, straight from the hero -->
    <path d="M310 35 A105 105 0 1 0 310 245 A118 118 0 0 1 310 35 Z"
          fill="#D9A84E" transform="rotate(-14 310 140)"/>

    <!-- sparkles in the crescent's opening; the two the cat would have sat on
         are gone, the rest kept where the hero has them -->
    <path d="M336 80 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4 Z"
          fill="#EDE3D0" opacity="0.7"/>
    <circle cx="238" cy="28" r="1.6" fill="#EDE3D0" opacity="0.5"/>
    <path d="M118 62 l2.1 5.8 5.8 2.1 -5.8 2.1 -2.1 5.8 -2.1 -5.8 -5.8 -2.1 5.8 -2.1 Z"
          fill="#EDE3D0" opacity="0.55"/>

    <!-- the cat, perched on the crescent's lower horn the way it does on the
         homepage. Silhouette and two gold eyes — the whiskers and nose the
         live cat has are noise at avatar size. -->
    <g transform="translate(253.6 134.3) scale(1.45)">
      <path d="M16 58 C11 62 9 67 9.5 73 C10 78 14 79 15 74.5 C15.8 71 14.5 66 16 62" fill="none" stroke="#201C18" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M20 62 C13.5 56 12.5 45 17 37.5 C20 32 26 28.5 32 28.5 C38 28.5 44 32 47 37.5 C51.5 45 50.5 56 44 62 Z" fill="#201C18"/>
      <circle cx="32" cy="17" r="12.5" fill="#201C18"/>
      <polygon points="22,9.5 19,0.5 29.5,5.5" fill="#201C18"/>
      <polygon points="42,9.5 45,0.5 34.5,5.5" fill="#201C18"/>
      <polygon points="23.2,7.8 21.5,2.8 27.5,5.6" fill="#B4726B" opacity="0.85"/>
      <polygon points="40.8,7.8 42.5,2.8 36.5,5.6" fill="#B4726B" opacity="0.85"/>
      <ellipse cx="26" cy="17.5" rx="4.1" ry="4.5" fill="#EDB94F"/>
      <ellipse cx="26" cy="17.5" rx="1.2" ry="3.4" fill="#201C18"/>
      <circle cx="24.6" cy="15.8" r="0.8" fill="#EDE3D0" opacity="0.9"/>
      <ellipse cx="38" cy="17.5" rx="4.1" ry="4.5" fill="#EDB94F"/>
      <ellipse cx="38" cy="17.5" rx="1.2" ry="3.4" fill="#201C18"/>
      <circle cx="36.6" cy="15.8" r="0.8" fill="#EDE3D0" opacity="0.9"/>
      <polygon points="30.6,23.5 33.4,23.5 32,25.4" fill="#B4726B"/>
      <path d="M30 26.6 Q31 27.6 32 26.6 Q33 27.6 34 26.6" fill="none" stroke="#EDE3D0" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="20" cy="21.5" r="1.9" fill="#C9622D" opacity="0.5"/>
      <circle cx="44" cy="21.5" r="1.9" fill="#C9622D" opacity="0.5"/>
      <path d="M13.5 19 L20 18.5" stroke="#93A184" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>
      <path d="M13.5 22.5 L20 21" stroke="#93A184" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>
      <path d="M50.5 19 L44 18.5" stroke="#93A184" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>
      <path d="M50.5 22.5 L44 21" stroke="#93A184" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>
      <path d="M24 28.8 Q32 32.3 40 28.8 L40 32 Q32 35.5 24 32 Z" fill="#C9622D"/>
      <circle cx="32" cy="33.8" r="2" fill="#D9A84E"/>
    </g>

    <!-- pumpkin, tucked beside the moon. Five lobes back-to-front so the
         overlapping strokes become the ridges. -->
    <g transform="translate(-30 0)">
      <g fill="#C9622D" stroke="#201C18" stroke-width="5">
        <ellipse cx="148" cy="228" rx="28" ry="46"/>
        <ellipse cx="242" cy="228" rx="28" ry="46"/>
        <ellipse cx="167" cy="226" rx="36" ry="54"/>
        <ellipse cx="223" cy="226" rx="36" ry="54"/>
        <ellipse cx="195" cy="224" rx="42" ry="58"/>
      </g>
      <path d="M186 170 C184 154 190 142 202 139 C210 137 214 142 212 149 C210 156 205 161 203 168 Z"
            fill="#5C6B4F" stroke="#201C18" stroke-width="4" stroke-linejoin="round"/>
      <path d="M212 146 C222 140 230 144 229 152 C228 158 222 159 220 155"
            fill="none" stroke="#5C6B4F" stroke-width="3" stroke-linecap="round"/>
      <polygon points="156,214 178,214 167,192" fill="#201C18"/>
      <polygon points="212,214 234,214 223,192" fill="#201C18"/>
      <polygon points="188,232 202,232 195,218" fill="#201C18"/>
      <path d="M148 238 Q195 272 242 238 Q195 312 148 238 Z" fill="#201C18"/>
      <rect x="180" y="252" width="12" height="10" rx="1.5" fill="#C9622D"/>
      <rect x="200" y="264" width="12" height="10" rx="1.5" fill="#C9622D"/>
    </g>
  </g>
</svg>
