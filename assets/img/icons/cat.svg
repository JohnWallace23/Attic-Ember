<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Attic & Ember — the shop cat, seated.
       This is the cat from assets/js/cat.js verbatim: its "pose-sit" markup,
       the pose it holds while perched in the homepage moon. Inner ears, slit
       pupils, nose, whiskers, rosy cheeks, collar and bell all as drawn.
       No SVG filter: the site's sage rim is a CSS drop-shadow, and importers
       that can't resolve a filter drop the element that references it.
       Centred on its measured bounds and scaled to sit inside a circle of
       840/1024, so a round crop takes nothing off. -->
