<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Attic & Ember favicon: the shop cat sitting in the moon.

       The homepage moon is a crescent, and this started as one. It doesn't
       survive a browser tab: a cat small enough to sit inside a crescent is
       about two pixels across at 16px, and a black cat on the near-black
       ground vanishes entirely. A full moon gives the silhouette a field of
       gold to sit on, so the cat still reads at tab size — which is the one
       size that has to work. -->
  <rect width="512" height="512" rx="104" fill="#201C18"/>
  <circle cx="256" cy="262" r="186" fill="#D9A84E"/>

  <!-- sitting cat, silhouette only — whiskers and a nose turn to mud small -->
  <g transform="translate(-20 -43)">
    <path d="M256 430 C214 430 198 384 208 344 C216 312 234 296 256 296
             C278 296 296 312 304 344 C314 384 298 430 256 430 Z" fill="#17120E"/>
    <circle cx="256" cy="286" r="50" fill="#17120E"/>
    <path d="M212 258 L220 206 L250 244 Z" fill="#17120E"/>
    <path d="M300 258 L292 206 L262 244 Z" fill="#17120E"/>
    <path d="M304 420 C352 416 366 374 344 342" fill="none" stroke="#17120E"
          stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="238" cy="284" rx="9" ry="11" fill="#EDB94F"/>
    <ellipse cx="274" cy="284" rx="9" ry="11" fill="#EDB94F"/>
  </g>

  <path d="M96 128 l4.5 13.5 13.5 4.5 -13.5 4.5 -4.5 13.5 -4.5 -13.5 -13.5 -4.5 13.5 -4.5 Z"
        fill="#EDE3D0" opacity="0.7"/>
</svg>
