title: Attic & Ember
tagline: Vintage finds, honest reproductions, and handmade treats
description: >-
  A small Chicago-run shop for real vintage Halloween collectibles —
  die-cuts, chalkware, blow molds, and costumes with some history to them.
# baseurl is empty because Cloudflare Pages serves the site from the
# domain root (not a GitHub Pages subfolder). Leave it as "".
baseurl: ""
url: "https://atticandember.com"

collections:
  products:
    output: true
    permalink: /shop/:path/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product

# ---- Checkout (manual payment: buyer pays via one of these after checkout) ----
order_email: "shop@atticandember.com"
# Public Web3Forms key (web3forms.com) — powers the on-page order form so
# buyers don't need an email app. Safe to commit; it just routes to order_email.
web3forms_key: "d1abc445-4121-4cb3-b1e3-31858bc804c3"
shipping_note: "Shipping is included on U.S. orders — we'll confirm anything unusual by email."
payments:
  # Full PayPal link (business profile or PayPal.Me), or just a PayPal.Me
  # username. The order total is appended to the URL.
  paypal_me: "https://www.paypal.biz/atticandember"
  venmo: "atticandember"   # Venmo username without the @   (blank to hide)
  cashapp: ""              # Cash App $cashtag without the $ (blank to hide)

plugins:
  - jekyll-feed
